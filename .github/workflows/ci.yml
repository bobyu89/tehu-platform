name: CI

# PR 與 master：型別檢查、lint、單元測試、建置；資料庫 migrations 依序套用到 Postgres 16，再跑 RLS 權限測試與同步契約測試。部署另見 deploy-pages.yml。
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/test/auth_stub.sql
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
      - name: RLS permission tests
        run: psql -v ON_ERROR_STOP=1 -q -o /dev/null -f supabase/test/rls.test.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Sync contract test (mapped rows → Postgres with RLS)
        working-directory: app
        env:
          SYNC_CONTRACT_PG: "1"
          PGDATABASE: postgres
        run: |
          npm ci
          npx vitest run src/lib/sync/contract.test.ts
